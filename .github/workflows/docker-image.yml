name: Build ACTIONS Folder

on:
  push:
    branches:
      - master
    paths:
      - 'ACTIONS/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build image
        uses: docker/build-push-action@v5
        with:
          context: ./ACTIONS
          file: ./ACTIONS/Dockerfile
          push: true
          tags: |
            cheogm28/github-integration:latest
            cheogm28/github-integration:${{ github.sha }}
