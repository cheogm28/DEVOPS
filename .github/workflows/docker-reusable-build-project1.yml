name: Build PROJECT1

on:
  push:
    branches:
      - master
    paths:
      - 'REUSABLE_WORKFLOW_CALL/PROJECT1/**'

jobs:
  call-reusable-build:
    uses: .github/workflows/docker-reusable.yml@master
    with:
      folder-name: 'REUSABLE_WORKFLOW_CALL/PROJECT1'
      image-name: 'project1-image'
      tag-name: 'proyect1'
    secrets: inherit
